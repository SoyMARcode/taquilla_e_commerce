<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · Taquilla</title>
<link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="registro" class="bg-ink font-sans text-fg antialiased">
<main class="mx-auto flex min-h-screen w-full max-w-md flex-col px-6 pb-8 pt-14">
  <a href="login.html" data-conservar-volver aria-label="Volver a iniciar sesión" class="flex h-11 w-11 items-center justify-center rounded-[14px] border border-line bg-surface text-fg transition hover:border-line2 hover:bg-surface2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
  </a>

  <div class="mt-6 flex flex-col gap-1.5">
    <h1 class="font-display text-[30px] font-bold leading-[1.1] tracking-tight">Crea tu cuenta</h1>
    <p class="text-[15px] text-muted">Compra entradas en segundos y llévalas en tu celular.</p>
  </div>

  <form id="form-registro" novalidate class="mt-6 flex flex-col gap-3.5">
    <div class="flex flex-col gap-1.5">
      <label for="nombre" class="text-[13px] font-medium text-soft">Nombre completo</label>
      <input id="nombre" type="text" autocomplete="name" placeholder="Nombre y apellido" aria-describedby="nombre-error"
        class="h-[50px] w-full rounded-[14px] border border-line bg-surface px-4 text-[15px] text-fg outline-none transition placeholder:text-placeholder focus:border-brand focus:ring-2 focus:ring-brand/25 aria-[invalid=true]:border-danger aria-[invalid=true]:ring-danger/20">
      <p id="nombre-error" class="hidden text-xs text-danger"></p>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="correo" class="text-[13px] font-medium text-soft">Correo electrónico</label>
      <input id="correo" type="email" autocomplete="email" placeholder="tu@correo.com" aria-describedby="correo-error"
        class="h-[50px] w-full rounded-[14px] border border-line bg-surface px-4 text-[15px] text-fg outline-none transition placeholder:text-placeholder focus:border-brand focus:ring-2 focus:ring-brand/25 aria-[invalid=true]:border-danger aria-[invalid=true]:ring-danger/20">
      <p id="correo-error" class="hidden text-xs text-danger"></p>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5">
        <label for="doc" class="text-[13px] font-medium text-soft">Documento</label>
        <input id="doc" type="text" inputmode="numeric" placeholder="C.C. / C.E." aria-describedby="doc-error"
          class="h-[50px] w-full rounded-[14px] border border-line bg-surface px-4 text-[15px] text-fg outline-none transition placeholder:text-placeholder focus:border-brand focus:ring-2 focus:ring-brand/25 aria-[invalid=true]:border-danger aria-[invalid=true]:ring-danger/20">
        <p id="doc-error" class="hidden text-xs text-danger"></p>
      </div>
      <div class="flex flex-col gap-1.5">
        <label for="tel" class="text-[13px] font-medium text-soft">Celular</label>
        <input id="tel" type="tel" autocomplete="tel" placeholder="300 000 0000" aria-describedby="tel-error"
          class="h-[50px] w-full rounded-[14px] border border-line bg-surface px-4 text-[15px] text-fg outline-none transition placeholder:text-placeholder focus:border-brand focus:ring-2 focus:ring-brand/25 aria-[invalid=true]:border-danger aria-[invalid=true]:ring-danger/20">
        <p id="tel-error" class="hidden text-xs text-danger"></p>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="pass" class="text-[13px] font-medium text-soft">Contraseña</label>
      <div class="relative">
        <input id="pass" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" aria-describedby="pass-error fuerza-texto"
          class="h-[50px] w-full rounded-[14px] border border-line bg-surface pl-4 pr-[52px] text-[15px] text-fg outline-none transition placeholder:text-placeholder focus:border-brand focus:ring-2 focus:ring-brand/25 aria-[invalid=true]:border-danger aria-[invalid=true]:ring-danger/20">
        <button type="button" data-toggle-password="pass" aria-label="Mostrar contraseña" aria-pressed="false"
          class="absolute right-1 top-[3px] flex h-11 w-11 items-center justify-center rounded-xl text-muted transition hover:text-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
          <svg data-icono="ojo" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg data-icono="ojo-off" class="hidden" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
        </button>
      </div>
      <div class="mt-1 grid grid-cols-4 gap-1.5" aria-hidden="true">
        <div data-barra class="h-1 rounded-sm bg-line"></div>
        <div data-barra class="h-1 rounded-sm bg-line"></div>
        <div data-barra class="h-1 rounded-sm bg-line"></div>
        <div data-barra class="h-1 rounded-sm bg-line"></div>
      </div>
      <span id="fuerza-texto" class="text-xs text-muted">Usa al menos 8 caracteres</span>
      <p id="pass-error" class="hidden text-xs text-danger"></p>
    </div>

    <div class="mt-1 flex flex-col gap-1.5">
      <label class="flex cursor-pointer items-start gap-2.5 text-[13px] leading-relaxed text-soft">
        <input id="terminos" type="checkbox" aria-describedby="terminos-error" class="mt-0.5 h-[18px] w-[18px] flex-none accent-brand">
        <span>Acepto los <a href="#" data-aviso="Términos y condiciones: compra sujeta a disponibilidad y políticas de cada evento." class="font-medium text-brand-light hover:text-brand-lighter">Términos y condiciones</a> y la <a href="#" data-aviso="Tus datos se usan solo para gestionar tus compras y enviarte tus entradas." class="font-medium text-brand-light hover:text-brand-lighter">Política de tratamiento de datos</a>.</span>
      </label>
      <p id="terminos-error" class="hidden text-xs text-danger"></p>
    </div>

    <button type="submit" class="mt-2 flex h-14 w-full items-center justify-center rounded-2xl bg-brand font-display text-[17px] font-semibold text-brand-ink transition hover:bg-brand-light active:scale-[.99] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-ink">Crear cuenta</button>
  </form>

  <p class="mt-auto pt-8 text-center text-[15px] text-muted">¿Ya tienes cuenta? <a href="login.html" data-conservar-volver class="font-semibold text-brand-light transition hover:text-brand-lighter">Inicia sesión</a></p>
</main>
<script src="js/app.js"></script>
</body>
</html>
