<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrito · Taquilla</title>
<link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="carrito" class="bg-ink font-sans text-fg antialiased">
<main class="mx-auto flex min-h-screen w-full max-w-md flex-col px-6 pb-8 pt-14">
  <header class="flex items-center gap-3.5">
    <a href="listado_eventos.html" aria-label="Volver a eventos" class="flex h-11 w-11 flex-none items-center justify-center rounded-[14px] border border-line bg-surface text-fg transition hover:border-line2 hover:bg-surface2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 class="flex-1 font-display text-2xl font-bold tracking-tight">Tu carrito</h1>
    <span id="conteo" class="text-sm text-muted">0 entradas</span>
  </header>

  <div id="reserva" class="mt-[18px] flex hidden items-center gap-2.5 rounded-[14px] border border-warn-line bg-warn-bg px-3.5 py-3 text-[13px] text-warn-fg">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>
    <span>Reservamos tus entradas por <b id="reserva-tiempo" class="text-white">10:00</b> min</span>
  </div>

  <div id="lista-carrito" class="mt-4 flex flex-col gap-3"></div>

  <div id="carrito-vacio" class="mt-6 flex hidden flex-col items-center rounded-[22px] border border-dashed border-line px-6 py-10 text-center">
    <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-surface2 text-brand">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"></path><path d="M6 6L5 3H2"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle></svg>
    </span>
    <p class="mt-4 font-display text-lg font-bold">Tu carrito está vacío</p>
    <p class="mt-1 text-sm text-muted">Explora los próximos eventos y agrega tus entradas.</p>
    <a href="listado_eventos.html" class="mt-5 flex h-11 items-center rounded-full bg-brand px-5 text-sm font-semibold text-brand-ink transition hover:bg-brand-light">Ver eventos</a>
  </div>

  <div id="carrito-detalle" class="flex flex-1 flex-col">
    <div class="mt-4 flex gap-2">
      <label for="cupon" class="sr-only">Código de descuento</label>
      <div class="flex min-w-0 flex-1 flex-col gap-1">
        <input id="cupon" type="text" placeholder="Código de descuento" autocomplete="off" aria-describedby="cupon-error"
          class="h-[50px] w-full rounded-[14px] border border-dashed border-line2 bg-panel px-4 text-[15px] uppercase text-fg outline-none transition placeholder:normal-case placeholder:text-placeholder read-only:border-solid read-only:border-success/50 read-only:text-success focus:border-brand focus:ring-2 focus:ring-brand/25 aria-[invalid=true]:border-danger">
        <p id="cupon-error" class="hidden text-xs text-danger"></p>
      </div>
      <button type="button" id="aplicar-cupon" class="h-[50px] flex-none rounded-[14px] border border-line bg-surface px-[18px] text-[15px] font-semibold transition hover:border-line2 hover:bg-surface2">Aplicar</button>
    </div>

    <div class="mt-[18px] flex flex-col gap-2.5 rounded-[18px] bg-surface p-4 text-sm">
      <div class="flex justify-between text-soft"><span id="subtotal-label">Subtotal</span><span id="subtotal">$0</span></div>
      <div id="fila-descuento" class="flex hidden justify-between text-success"><span id="descuento-label">Descuento</span><span id="descuento">$0</span></div>
      <div class="flex justify-between text-soft"><span>Cargo por servicio</span><span id="servicio">$0</span></div>
      <div class="h-px bg-line"></div>
      <div class="flex items-baseline justify-between"><span class="text-[15px] font-semibold">Total</span><span id="total" class="font-display text-[22px] font-bold">$0</span></div>
    </div>

    <div class="mt-auto pt-6">
      <a href="pasarela.html" id="continuar" class="flex h-[58px] items-center justify-between rounded-2xl bg-brand px-[22px] font-display text-[17px] font-semibold text-brand-ink transition hover:bg-brand-light active:scale-[.99] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-ink">
        <span>Continuar al pago</span>
        <span class="flex items-center gap-1.5"><span id="continuar-total">$0</span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </span>
      </a>
    </div>
  </div>
</main>
<script src="js/app.js"></script>
</body>
</html>
