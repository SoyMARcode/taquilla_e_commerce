<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Taquilla</title>
<link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="login" class="bg-ink font-sans text-fg antialiased">
<main class="mx-auto flex min-h-screen w-full max-w-md flex-col px-6 pb-9 pt-16">
  <a href="listado_eventos.html" class="flex items-center gap-2.5 self-start rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
    <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand text-brand-ink">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a3 3 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a3 3 0 0 0 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"></path><path d="M14 5v2M14 11v2M14 17v2"></path></svg>
    </span>
    <span class="font-display text-[22px] font-bold tracking-tight">Taquilla</span>
  </a>

  <div class="mt-12 flex flex-col gap-2">
    <h1 class="font-display text-[34px] font-bold leading-[1.1] tracking-tight">Hola de nuevo</h1>
    <p class="text-[15px] text-muted">Inicia sesión para comprar y ver tus entradas.</p>
  </div>

  <form id="form-login" novalidate class="mt-9 flex flex-col gap-[18px]">
    <div id="login-alerta" class="hidden" role="alert"></div>

    <div class="flex flex-col gap-2">
      <label for="email" class="text-[13px] font-medium text-soft">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" aria-describedby="email-error"
        class="h-[52px] w-full rounded-[14px] border border-line bg-surface px-4 text-[15px] text-fg outline-none transition placeholder:text-placeholder focus:border-brand focus:ring-2 focus:ring-brand/25 aria-[invalid=true]:border-danger aria-[invalid=true]:ring-danger/20">
      <p id="email-error" class="hidden text-xs text-danger"></p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="password" class="text-[13px] font-medium text-soft">Contraseña</label>
      <div class="relative">
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" aria-describedby="password-error"
          class="h-[52px] w-full rounded-[14px] border border-line bg-surface pl-4 pr-[52px] text-[15px] text-fg outline-none transition placeholder:text-placeholder focus:border-brand focus:ring-2 focus:ring-brand/25 aria-[invalid=true]:border-danger aria-[invalid=true]:ring-danger/20">
        <button type="button" data-toggle-password="password" aria-label="Mostrar contraseña" aria-pressed="false"
          class="absolute right-1 top-1 flex h-11 w-11 items-center justify-center rounded-xl text-muted transition hover:text-fg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
          <svg data-icono="ojo" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg data-icono="ojo-off" class="hidden" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
        </button>
      </div>
      <p id="password-error" class="hidden text-xs text-danger"></p>
    </div>

    <div class="flex items-center justify-between">
      <label class="flex cursor-pointer items-center gap-2 text-sm text-soft">
        <input id="recordar" type="checkbox" checked class="h-[18px] w-[18px] accent-brand">
        Recordarme
      </label>
      <button type="button" id="olvide" class="text-sm font-medium text-brand-light transition hover:text-brand-lighter">¿Olvidaste tu contraseña?</button>
    </div>

    <button type="submit" class="mt-2.5 flex h-14 w-full items-center justify-center rounded-2xl bg-brand font-display text-[17px] font-semibold text-brand-ink transition hover:bg-brand-light active:scale-[.99] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2 focus-visible:ring-offset-ink">Iniciar sesión</button>
  </form>

  <div class="mt-7 flex items-center gap-3 text-[13px] text-dim">
    <div class="h-px flex-1 bg-line"></div>
    <span>o continúa con</span>
    <div class="h-px flex-1 bg-line"></div>
  </div>

  <div class="mt-5 grid grid-cols-2 gap-3">
    <button type="button" data-social="Google" class="flex h-[52px] items-center justify-center gap-2 rounded-[14px] border border-line bg-surface text-[15px] font-medium transition hover:border-line2 hover:bg-surface2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 12h8"></path></svg>
      Google
    </button>
    <button type="button" data-social="Apple" class="flex h-[52px] items-center justify-center gap-2 rounded-[14px] border border-line bg-surface text-[15px] font-medium transition hover:border-line2 hover:bg-surface2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"></rect><path d="M11 18h2"></path></svg>
      Apple
    </button>
  </div>

  <p class="mt-auto pt-10 text-center text-[15px] text-muted">¿No tienes cuenta? <a href="registro.html" data-conservar-volver class="font-semibold text-brand-light transition hover:text-brand-lighter">Regístrate</a></p>
</main>
<script src="js/app.js"></script>
</body>
</html>
