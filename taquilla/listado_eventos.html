<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventos · Taquilla</title>
<link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="eventos" class="bg-ink font-sans text-fg antialiased">
<main class="mx-auto min-h-screen w-full max-w-md px-6 pb-32 pt-14">
  <header class="flex items-center justify-between">
    <div class="flex flex-col gap-0.5">
      <span class="text-[13px] text-muted">Medellín · Próximas semanas</span>
      <h1 id="saludo" class="font-display text-2xl font-bold tracking-tight">Hola</h1>
    </div>
    <a href="carrito_compras.html" data-cart-link aria-label="Carrito" class="relative flex h-12 w-12 items-center justify-center rounded-2xl border border-line bg-surface text-fg transition hover:border-line2 hover:bg-surface2 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"></path><path d="M6 6L5 3H2"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle></svg>
      <span data-cart-count class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-brand px-[5px] text-[11px] font-bold text-brand-ink hidden">0</span>
    </a>
  </header>

  <div class="relative mt-5">
    <label for="buscar" class="absolute left-4 top-[15px] flex text-dim">
      <svg role="img" aria-label="Buscar" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </label>
    <input id="buscar" type="search" placeholder="Artista, evento o lugar" autocomplete="off"
      class="h-[50px] w-full rounded-2xl border border-line bg-surface pl-[46px] pr-4 text-[15px] text-fg outline-none transition placeholder:text-placeholder focus:border-brand focus:ring-2 focus:ring-brand/25">
  </div>

  <div class="-mx-6 mt-4 flex gap-2 overflow-x-auto px-6 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden" role="group" aria-label="Categorías">
    <button type="button" data-categoria="Todos" class="h-9 flex-none rounded-full border border-brand bg-brand px-4 text-sm font-semibold text-brand-ink">Todos</button>
    <button type="button" data-categoria="Conciertos" class="h-9 flex-none rounded-full border border-line bg-surface px-4 text-sm">Conciertos</button>
    <button type="button" data-categoria="Teatro" class="h-9 flex-none rounded-full border border-line bg-surface px-4 text-sm">Teatro</button>
    <button type="button" data-categoria="Deportes" class="h-9 flex-none rounded-full border border-line bg-surface px-4 text-sm">Deportes</button>
    <button type="button" data-categoria="Stand-up" class="h-9 flex-none rounded-full border border-line bg-surface px-4 text-sm">Stand-up</button>
  </div>

  <section id="destacado" aria-label="Evento destacado"></section>

  <div class="mt-6 flex items-baseline justify-between">
    <h2 class="font-display text-[19px] font-bold">Próximos eventos</h2>
    <button type="button" id="ver-todos" class="text-sm font-medium text-brand-light transition hover:text-brand-lighter">Ver todos</button>
  </div>

  <div id="lista-eventos" class="mt-3 flex flex-col gap-2.5"></div>

  <div id="sin-resultados" class="mt-3 hidden rounded-[18px] border border-dashed border-line px-5 py-8 text-center">
    <p class="font-medium">No encontramos eventos</p>
    <p class="mt-1 text-sm text-muted">Prueba con otra búsqueda o categoría.</p>
    <button type="button" id="limpiar-filtros" class="mt-4 h-10 rounded-full border border-line bg-surface px-4 text-sm font-semibold transition hover:bg-surface2">Limpiar filtros</button>
  </div>
</main>

<nav aria-label="Navegación principal" class="fixed inset-x-0 bottom-0 z-40 border-t border-surface2 bg-panel/95 backdrop-blur">
  <div class="mx-auto grid h-[84px] max-w-md grid-cols-4 px-4 pb-[22px] pt-2.5">
    <a href="listado_eventos.html" aria-current="page" class="flex flex-col items-center justify-center gap-1 text-[11px] font-semibold text-brand">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      Inicio
    </a>
    <a href="#buscar" id="nav-explorar" class="flex flex-col items-center justify-center gap-1 text-[11px] font-medium text-muted transition hover:text-fg">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      Explorar
    </a>
    <a href="confirmacion.html" class="flex flex-col items-center justify-center gap-1 text-[11px] font-medium text-muted transition hover:text-fg">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a3 3 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a3 3 0 0 0 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"></path><path d="M14 5v2M14 11v2M14 17v2"></path></svg>
      Mis entradas
    </a>
    <a href="login.html" data-perfil class="flex flex-col items-center justify-center gap-1 text-[11px] font-medium text-muted transition hover:text-fg">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      <span data-perfil-texto>Perfil</span>
    </a>
  </div>
</nav>
<script src="js/app.js"></script>
</body>
</html>
